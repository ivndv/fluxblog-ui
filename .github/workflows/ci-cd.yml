# FluxBlog UI CI/CD — lint -> test -> deploy (solo push a main)
# Flujo: Cualquier push o PR a main/develop ejecuta lint/format y pruebas en paralelo; deploy a Cloudflare Pages solo se dispara en push a main con todo en verde.

name: Blog Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job 1: Análisis estático y verificación de formato con Biome
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run check

  # Job 2: Pruebas unitarias de componentes y utilidades con Vitest
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Run tests
        run: bun run test

  # Job 3: Compilación y despliegue a Cloudflare Pages (solo en rama main tras pasar lint y test)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build
        env:
          PAYLOAD_URL: ${{ secrets.PAYLOAD_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=fluxblog-ui
