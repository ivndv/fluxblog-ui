# FluxBlog UI CI/CD — lint -> test -> deploy (solo push a main)
# Flujo: Cualquier push o PR a main/develop ejecuta lint/format y pruebas en paralelo; deploy a Cloudflare Pages solo se dispara en push a main con todo en verde.

name: Blog Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref, excepto deploys en main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: Análisis estático y verificación de formato con Biome
  lint:
    name: Biome
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Biome CI
        run: bunx biome ci .

  # Job 2: Pruebas unitarias de componentes y utilidades con Vitest
  test:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Run tests
        run: bun run test

  # Job 3: Compilación y despliegue a Cloudflare Pages (solo en rama main tras pasar lint y test)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build
        env:
          PAYLOAD_URL: ${{ secrets.PAYLOAD_URL }}

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist/ --project-name=fluxblog-ui --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ---------------------------------------------------------------------------
  # Escaneo de secretos. Workflow reutilizable definido en ivndv/.github
  # ---------------------------------------------------------------------------
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
